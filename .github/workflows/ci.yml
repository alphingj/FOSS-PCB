name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx tsc lib/sim/values.ts lib/sim/mna.ts lib/sim/switching.ts lib/foss-schema.ts lib/sample-buckboost.ts lib/routing.ts lib/drc.ts lib/kicad-io.ts lib/kicad-pads.ts lib/repair.ts lib/drc.ts lib/erc.ts lib/grounding.ts lib/library.ts lib/spice.ts --outDir ./check-out --module commonjs --target es2020 --esModuleInterop --skipLibCheck
      - run: node scripts/prepare-checks.cjs simcheck.cjs ./check-out simcheck-run.cjs
      - run: node scripts/prepare-checks.cjs routecheck.cjs ./check-out routecheck-run.cjs
      - run: node scripts/prepare-checks.cjs padcheck.cjs ./check-out padcheck-run.cjs
      - run: node scripts/prepare-checks.cjs spicecheck.cjs ./check-out spicecheck-run.cjs
      - run: node scripts/prepare-checks.cjs fabcheck.cjs ./check-out fabcheck-run.cjs
      - run: node scripts/prepare-checks.cjs repaircheck.cjs ./check-out repaircheck-run.cjs
      - run: node simcheck-run.cjs
      - run: node routecheck-run.cjs
      - run: node padcheck-run.cjs
      - run: node spicecheck-run.cjs
      - run: node fabcheck-run.cjs
      - run: node repaircheck-run.cjs

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  python:
    runs-on: windows-latest
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python python/verify_plugins.py
      - run: python python/padcheck_py.py
